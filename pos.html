<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thirsty - POS System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="pos-styles.css">
</head>
<body>
    <div class="pos-container">
        <!-- Header -->
        <header class="pos-header">
            <div class="logo">
                <i class="fas fa-tint"></i>
                <h1>Thirsty</h1>
                <span>Soda Shop POS</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="openOrderHistory()">
                    <i class="fas fa-history"></i> Order History
                </button>
                <button class="btn btn-secondary" onclick="openSettings()">
                    <i class="fas fa-cog"></i> Settings
                </button>
                <div class="cashier-info">
                    <i class="fas fa-user"></i>
                    <span>Cashier: Admin</span>
                </div>
            </div>
        </header>

        <div class="pos-main">
            <!-- Product Grid -->
            <div class="products-section">
                <div class="section-header">
                    <h2>Products</h2>
                    <div class="category-filters">
                        <button class="category-btn active" onclick="filterCategory('all')">All</button>
                        <button class="category-btn" onclick="filterCategory('sodas')">Sodas</button>
                        <button class="category-btn" onclick="filterCategory('juices')">Juices</button>
                        <button class="category-btn" onclick="filterCategory('water')">Water</button>
                        <button class="category-btn" onclick="filterCategory('snacks')">Snacks</button>
                    </div>
                </div>
                
                <div class="products-grid" id="productsGrid">
                    <!-- Products will be populated by JavaScript -->
                </div>
            </div>

            <!-- Cart Section -->
            <div class="cart-section">
                <div class="cart-header">
                    <h2>Current Order</h2>
                    <button class="btn btn-danger btn-sm" onclick="clearCart()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>

                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Cart is empty</p>
                    </div>
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (8.5%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                </div>

                <div class="payment-section">
                    <div class="payment-methods">
                        <button class="payment-btn" onclick="processPayment('cash')">
                            <i class="fas fa-money-bill"></i>
                            Cash
                        </button>
                        <button class="payment-btn" onclick="processPayment('card')">
                            <i class="fas fa-credit-card"></i>
                            Card
                        </button>
                    </div>
                    <button class="btn btn-primary btn-large" onclick="processOrder()" id="checkoutBtn" disabled>
                        <i class="fas fa-check"></i> Process Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Order History Modal -->
    <div id="orderHistoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Order History</h2>
                <span class="close" onclick="closeModal('orderHistoryModal')">&times;</span>
            </div>
            <div class="modal-body" id="orderHistoryContent">
                <!-- Order history will be populated here -->
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div id="receiptModal" class="modal">
        <div class="modal-content receipt-modal">
            <div class="modal-header">
                <h2>Receipt</h2>
                <span class="close" onclick="closeModal('receiptModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div id="receiptContent" class="receipt">
                    <!-- Receipt content will be populated here -->
                </div>
                <div class="receipt-actions">
                    <button class="btn btn-secondary" onclick="printReceipt()">
                        <i class="fas fa-print"></i> Print
                    </button>
                    <button class="btn btn-primary" onclick="closeModal('receiptModal')">
                        <i class="fas fa-check"></i> Done
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cash Payment Modal -->
    <div id="cashPaymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cash Payment</h2>
                <span class="close" onclick="closeModal('cashPaymentModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="cash-payment">
                    <div class="payment-info">
                        <div class="payment-row">
                            <span>Total Amount:</span>
                            <span id="cashTotal">$0.00</span>
                        </div>
                        <div class="payment-row">
                            <label for="cashReceived">Cash Received:</label>
                            <input type="number" id="cashReceived" step="0.01" min="0" onchange="calculateChange()">
                        </div>
                        <div class="payment-row">
                            <span>Change:</span>
                            <span id="changeAmount">$0.00</span>
                        </div>
                    </div>
                    <div class="quick-amounts">
                        <button class="amount-btn" onclick="setCashAmount(5)">$5</button>
                        <button class="amount-btn" onclick="setCashAmount(10)">$10</button>
                        <button class="amount-btn" onclick="setCashAmount(20)">$20</button>
                        <button class="amount-btn" onclick="setCashAmount(50)">$50</button>
                        <button class="amount-btn" onclick="setCashAmount(100)">$100</button>
                        <button class="amount-btn" onclick="setExactAmount()">Exact</button>
                    </div>
                    <button class="btn btn-success btn-large" onclick="completeCashPayment()" id="completeCashBtn" disabled>
                        Complete Payment
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="pos-script.js"></script>
</body>
</html>
